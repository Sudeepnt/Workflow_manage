<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sangeetha Store Map</title>
    <link rel="stylesheet" href="/sangeetha-map/styles.css" />
  </head>
  <body>
    <main class="map-shell">
      <div class="map-canvas" id="map" aria-label="Sangeetha store map"></div>

      <section class="map-control-stack" aria-label="Map controls">
        <header class="map-topbar">
          <h1 aria-label="Sangeetha Store Map">
            <img class="map-brand-logo" src="/sangeetha-map/assets/sangeetha-logo.png" alt="" aria-hidden="true" />
            <span>Store</span>
          </h1>
          <label class="region-control">
            <span class="sr-only">Region</span>
            <select id="region-filter" aria-label="Filter stores by state" autocomplete="off">
              <option value="">All India</option>
            </select>
          </label>
          <div class="map-actions">
            <button class="action-button action-icon-button" id="refresh-button" type="button" aria-label="Import or refresh stores" title="Refresh stores">
              <svg class="control-icon" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M20 6v5h-5M4 18v-5h5M18.2 9A7 7 0 0 0 6.6 6.8M5.8 15A7 7 0 0 0 17.4 17.2" />
              </svg>
            </button>
          </div>
        </header>

        <div class="map-tools" aria-label="Map search and location controls">
          <div class="city-search-card">
            <span class="search-glyph" aria-hidden="true"></span>
            <div class="city-search-host" id="city-search-host">
              <input class="store-search-input" id="store-search-input" type="search" placeholder="Search store no or name" autocomplete="off" aria-label="Search store number or name" />
              <div class="store-search-results" id="store-search-results" hidden></div>
            </div>
          </div>
        </div>

        <div class="map-helper-card" id="map-helper-card" hidden>
          <p class="map-helper-title" id="map-helper-title">Select Area</p>
          <p class="map-helper-text" id="map-helper-text">Tap the map to draw a boundary.</p>
        </div>
      </section>

      <button class="location-button" id="location-button" type="button" aria-label="Show my current location" title="My location">
        <span class="location-glyph" aria-hidden="true"></span>
      </button>

      <div class="map-modebar" aria-label="Store management tools">
        <button class="mode-button add-store-mode" id="add-store-button" type="button">
          <span class="mode-icon mode-icon-plus" aria-hidden="true"></span>
          <span>Add Store</span>
        </button>
        <button class="mode-button area-mode is-primary" id="area-button" type="button">
          <span class="mode-icon mode-icon-corners" aria-hidden="true"></span>
          <span>Select Area</span>
        </button>
        <button class="mode-button mode-button-clear" id="area-clear-button" type="button" aria-label="Clear area selection" title="Clear area" hidden>
          <svg class="control-icon" aria-hidden="true" viewBox="0 0 24 24">
            <path d="M6 6l12 12M18 6 6 18" />
          </svg>
        </button>
      </div>

      <section class="sr-only" id="status-card" aria-live="polite">
        <p class="status-label" id="status-label">Connecting…</p>
        <p class="status-detail" id="status-detail">Loading map configuration and cached store locations.</p>
      </section>

      <section class="store-sheet" id="store-sheet" role="dialog" aria-live="polite" hidden>
        <div class="sheet-handle" aria-hidden="true"></div>
        <button class="sheet-close" id="sheet-close" type="button" aria-label="Close store details">
          <svg class="control-icon" aria-hidden="true" viewBox="0 0 24 24">
            <path d="M6 6l12 12M18 6 6 18" />
          </svg>
        </button>

        <div class="sheet-view" id="sheet-store-view">
          <p class="sheet-kicker" id="sheet-kicker">Sangeetha Mobiles</p>
          <h2 class="sheet-title" id="sheet-title">Store</h2>
          <div class="sheet-detail-stack">
            <p class="sheet-meta detail-row">
              <svg class="detail-icon" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M4 10h16M6 10v9h12v-9M8 19v-5h4v5M5 10l1-5h12l1 5M9 5v5M15 5v5" />
              </svg>
              <span id="sheet-meta"></span>
            </p>
            <p class="sheet-address detail-row">
              <svg class="detail-icon" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M12 21s7-5.2 7-11a7 7 0 1 0-14 0c0 5.8 7 11 7 11Z" />
                <circle cx="12" cy="10" r="2.6" />
              </svg>
              <span id="sheet-address"></span>
            </p>
            <p class="sheet-coordinates detail-row">
              <svg class="detail-icon" aria-hidden="true" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="5" />
                <path d="M12 2v4M12 18v4M2 12h4M18 12h4" />
              </svg>
              <span id="sheet-coordinates"></span>
            </p>
          </div>
          <div class="sheet-actions">
            <a class="sheet-link" id="sheet-link" href="#" target="_blank" rel="noreferrer">
              <svg class="button-icon" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M12 21s7-5.2 7-11a7 7 0 1 0-14 0c0 5.8 7 11 7 11Z" />
                <circle cx="12" cy="10" r="2.5" />
              </svg>
              <span>Open in Google Maps</span>
            </a>
          </div>

          <form class="store-edit-form" id="sqft-form">
            <label class="sheet-field sqft-field">
              <span>Store Sqft</span>
              <span class="sqft-row">
                <input id="sqft-input" type="text" inputmode="numeric" placeholder="1850" autocomplete="off" />
                <button class="sheet-save-button" id="sqft-save-button" type="submit">Save Sqft</button>
              </span>
            </label>
          </form>
        </div>

        <div class="sheet-view" id="sheet-add-view" hidden>
          <p class="sheet-kicker">Manual Store</p>
          <h2 class="sheet-title">Add a New Store</h2>
          <form class="add-store-form" id="add-store-form">
            <label class="sheet-field">
              <span>Store Name</span>
              <input id="add-store-name" type="text" required autocomplete="off" />
            </label>
            <div class="sheet-grid">
              <label class="sheet-field">
                <span>Latitude</span>
                <input id="add-store-latitude" type="text" inputmode="decimal" required autocomplete="off" />
              </label>
              <label class="sheet-field">
                <span>Longitude</span>
                <input id="add-store-longitude" type="text" inputmode="decimal" required autocomplete="off" />
              </label>
            </div>
            <label class="sheet-field">
              <span>Address</span>
              <textarea id="add-store-address" rows="3"></textarea>
            </label>
            <div class="sheet-grid">
              <label class="sheet-field">
                <span>City</span>
                <input id="add-store-city" type="text" autocomplete="off" />
              </label>
              <label class="sheet-field">
                <span>State</span>
                <input id="add-store-state" type="text" autocomplete="off" />
              </label>
            </div>
            <label class="sheet-field">
              <span>Store Sqft</span>
              <input id="add-store-sqft" type="text" inputmode="numeric" autocomplete="off" />
            </label>
            <button class="sheet-save-button" id="add-store-save-button" type="submit">Create Store</button>
          </form>
        </div>

        <section class="selection-panel" id="proximity-panel" hidden>
          <div class="selection-panel-header">
            <h3>Stores Near This Point</h3>
            <p id="proximity-origin-label"></p>
          </div>
          <div class="radius-options" id="radius-options">
            <button class="radius-chip" type="button" data-radius-km="1">1 km</button>
            <button class="radius-chip" type="button" data-radius-km="3">3 km</button>
            <button class="radius-chip" type="button" data-radius-km="5">5 km</button>
            <button class="radius-chip" type="button" data-radius-km="10">10 km</button>
          </div>
          <div class="proximity-actions">
            <button class="proximity-action-button proximity-action-primary" id="proximity-done-button" type="button">
              <svg class="button-icon" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M5 12.5 10 17l9-10" />
              </svg>
              <span>Done</span>
            </button>
            <button class="proximity-action-button" id="proximity-clear-button" type="button">
              <svg class="button-icon button-icon-danger" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M5 7h14M10 11v6M14 11v6M9 7V5h6v2M7 7l1 14h8l1-14" />
              </svg>
              <span>Clear</span>
            </button>
          </div>
          <p class="selection-summary" id="proximity-summary"></p>
          <ul class="selection-list" id="proximity-list"></ul>
        </section>

        <section class="selection-panel" id="area-panel" hidden>
          <div class="selection-panel-header">
            <h3>Selected Area</h3>
            <p id="area-summary"></p>
          </div>
          <ul class="selection-list" id="area-list"></ul>
        </section>

        <p class="sheet-feedback" id="sheet-feedback" hidden></p>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2/dist/umd/supabase.js"></script>
    <script src="https://unpkg.com/@googlemaps/markerclusterer@2.6.2/dist/index.min.js" defer></script>
    <script src="/sangeetha-map/app.js" defer></script>
  </body>
</html>
